<body>
  <div class="app-root">

    <!-- Sticky Nav -->
    <header class="site-header" id="site-header">
      <div class="nav-inner">
        <a href="#hero" class="nav-brand">ASRock AI Center</a>
        <ul class="nav-links" id="nav-links">
          <!-- populated by main.js -->
        </ul>
        <div class="nav-actions">
          <a class="official-btn" id="official-link" href="#" target="_blank" rel="noreferrer"></a>
          <button class="lang-btn" id="lang-toggle-btn">
            <span>EN</span>
          </button>
        </div>
      </div>
    </header>

    <div class="container">

      <!-- Hero -->
      <header id="hero">
        <h1 data-i18n="header.title">ASRock AI Center</h1>
        <h2 class="gradient-text" data-i18n="header.subtitle"></h2>
        <p class="tagline" data-i18n="header.taglines.0"></p>
        <p class="tagline" data-i18n="header.taglines.1"></p>
      </header>

      <!-- Why AI Center -->
      <section class="section" id="why">
        <div class="section-head">
          <h2 data-i18n="whySection.title"></h2>
          <p class="section-subtitle" data-i18n="whySection.subtitle"></p>
        </div>
        <div class="bento" id="why-grid">
          <!-- populated by main.js -->
        </div>
      </section>

      <!-- Services -->
      <section class="section" id="services">
        <div class="section-head">
          <h2 data-i18n="processSection.title"></h2>
          <p class="section-subtitle" data-i18n="processSection.subtitle"></p>
        </div>
        <div class="process-steps" id="process-steps">
          <!-- populated by main.js -->
        </div>
      </section>

      <!-- Products -->
      <section class="section" id="products">
        <div class="section-head">
          <h2 data-i18n="appsSection.title"></h2>
          <p class="section-subtitle" data-i18n="appsSection.subtitle"></p>
        </div>
        <div class="bento" id="apps-grid">
          <!-- populated by main.js -->
        </div>
      </section>

      <!-- Solutions / Case Studies -->
      <section class="section" id="solutions">
        <div class="section-head">
          <h2 data-i18n="successStoriesSection.title"></h2>
          <p class="section-subtitle" data-i18n="successStoriesSection.subtitle"></p>
        </div>
        <div class="bento" id="success-stories-grid">
          <!-- populated by main.js -->
        </div>
      </section>

      <!-- Resources -->
      <section class="section" id="resources">
        <div class="section-head">
          <h2 data-i18n="resources.title"></h2>
          <p class="section-subtitle" data-i18n="resources.subtitle"></p>
        </div>
        <div class="links-grid" id="resources-grid">
          <!-- populated by main.js -->
        </div>
      </section>

      <!-- Developer Courses -->
      <section class="section" id="courses">
        <div class="section-head">
          <h2 data-i18n="coursesSection.title"></h2>
          <p class="section-subtitle" data-i18n="coursesSection.subtitle"></p>
        </div>
        <div class="links-grid" id="courses-grid">
          <!-- populated by main.js -->
        </div>
      </section>

      <!-- Blogs -->
      <section class="section" id="blogs">
        <div class="section-head">
          <h2 data-i18n="blogsSection.title"></h2>
          <p class="section-subtitle" data-i18n="blogsSection.subtitle"></p>
        </div>
        <div class="links-grid" id="blogs-grid">
          <!-- populated by main.js -->
        </div>
      </section>

      <!-- YouTube -->
      <section class="section youtube-section hidden" id="youtube-section">
        <div class="section-head">
          <h2 data-i18n="youtubeSection.title"></h2>
          <p class="section-subtitle" data-i18n="youtubeSection.subtitle"></p>
        </div>
        <div class="videos-grid" id="videos-grid">
          <!-- populated by main.js -->
        </div>
        <div style="text-align:center; margin-top:2rem;">
          <a href="#" target="_blank" rel="noreferrer" id="videos-more"
            style="color:var(--accent); text-decoration:none; font-size:14px;"></a>
        </div>
      </section>

      <!-- Contact -->
      <section class="section contact-section" id="contact">
        <h2 data-i18n="contact.title"></h2>
        <div class="contact-cards" id="contact-cards">
          <!-- populated by main.js -->
        </div>
      </section>

      <footer class="site-footer">
        <span data-i18n="footer.copyright"></span>
      </footer>

    </div><!-- /.container -->

  <script src="locales.js"></script>
  <script src="main.js"></script>
